<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" href="34908.jpg" type="image/jpeg" />
  <title>Inventory | Best Fruits Stall</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="theme.css" />
  <!-- Project fonts: Lumiare + Eternalo, loaded last so they apply everywhere -->
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="fog.css" />
</head>
<body data-page="inventory" class="page-inventory">
<div class="fog-layer" aria-hidden="true"><div class="fog-glow"></div><div class="fog-bank fog-bank-1"></div><div class="fog-bank fog-bank-2"></div><div class="fog-bank fog-bank-3"></div></div>

<div class="toast-container" id="toastContainer"></div>

<div class="app no-panel">
  <aside class="side" aria-label="Main menu">
    <div class="brand"><img src="34908.jpg" alt="" /><div><span class="gold">Best Fruits Stall</span><small>BFS BILLING</small></div></div>
    <a class="nv" href="billing.html">Billing</a>
    <a class="nv" href="live-map.html">3D Live Map</a>
    <a class="nv" href="history.html">History</a>
    <a class="nv" href="reports.html">Reports</a>
    <a class="nv on" href="inventory.html" aria-current="page">Inventory</a>
    <div class="grow"></div>
    <button type="button" class="nv" id="adminLoginBtn" onclick="pageAdminLogin()">Admin Login</button>
    <button type="button" class="nv logout" data-admin-only hidden onclick="adminLogout()">Logout</button>
  </aside>

  <main class="main">
    <div class="top"><div><h1 class="page-title">Stock <span class="gold">Inventory</span></h1><div class="sub">Stock updates automatically with every bill</div></div></div>
    <div class="card locked" data-admin-locked>
      <p>Inventory is for the admin only.</p>
      <button type="button" class="btn-gold" onclick="pageAdminLogin()">Admin Login</button>
    </div>
    <div class="page-body" data-admin-only hidden>
      <div class="ap-body">
          <div class="ap-section ap-cell">
            <button class="hist-dl-btn" onclick="apOpen(showHistDrawer)">&#x1F4DC; History</button>
            <button class="hist-dl-btn" onclick="apOpen(showRptDrawer)">📊 Reports</button>
            <button class="hist-dl-btn" onclick="apExport()">&#x2B07; Export inventory</button>
            <label class="hist-dl-btn" for="apImportFile" tabindex="0" role="button"
                   onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">&#x2B06; Import inventory</label>
            <input type="file" id="apImportFile" class="ap-file" accept="application/json,.json" onchange="apImport(this)" />
            <span class="ap-err" id="apFileMsg" role="status" aria-live="polite"></span>
          </div>

          <div class="ap-section">
            <h4>🗂️ Categories</h4>
            <form class="ap-form" id="apCatForm" onsubmit="apAddCategory(event)">
              <label>New category <input type="text" id="apNewCatName" maxlength="30" required style="width:180px" /></label>
              <button type="submit" class="hist-dl-btn">Add category</button>
            </form>
            <p class="ap-err" id="apCatErr" role="alert" aria-live="assertive"></p>
            <div class="ap-cat-chips" id="apCatChips"></div>
          </div>

          <div class="ap-section">
            <h4>➕ New item</h4>
            <form class="ap-form" id="apNewForm" onsubmit="apAddItem(event)">
              <label>Name <input type="text" id="apNewName" maxlength="60" required /></label>
              <label>Image <input type="file" id="apNewImg" accept="image/*" onchange="apPickNewImage(this)" /></label>
              <img id="apNewImgPreview" alt="New item photo preview" hidden style="width:56px;height:56px;object-fit:cover;border-radius:8px" />
              <label>Price <input type="number" id="apNewPrice" class="ap-num" min="1" max="100000" step="any" required /></label>
              <label>Category <input type="text" id="apNewCat" list="apCatList" maxlength="30" required style="width:110px" /></label>
              <datalist id="apCatList"></datalist>
              <label class="ap-check"><input type="checkbox" id="apNewIce" checked /> Ice</label>
              <label class="ap-check"><input type="checkbox" id="apNewSugar" checked /> Sugar</label>
              <button type="submit" class="hist-dl-btn">Add item</button>
            </form>
            <p class="ap-err" id="apNewErr" role="alert" aria-live="assertive"></p>
          </div>

          <table class="hist-table">
            <thead><tr><th>Item</th><th>Category</th><th>Price (₹)</th><th>Available</th><th>Stock</th><th><span class="sr-only">Remove</span></th></tr></thead>
            <tbody id="apTableBody"></tbody>
          </table>
        </div>
    </div>
  </main>
</div>

<!-- ADMIN LOGIN MODAL (Req 2.1, 2.4, 2.5) -->
<div class="overlay" id="adminLoginOverlay" onclick="if (event.target === this) closeAdminLogin()">
  <form class="modal" id="adminLoginForm" role="dialog" aria-modal="true" aria-labelledby="adminLoginTitle" onsubmit="submitAdminLogin(event)">
    <h3 id="adminLoginTitle">🔐 Admin Login</h3>
    <div class="form-row">
      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" autocomplete="current-password" required />
    </div>
    <p class="admin-login-error" id="adminLoginError" role="alert" aria-live="assertive"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeAdminLogin()">Cancel</button>
      <button type="submit" class="btn btn-primary" id="adminLoginSubmit">Login</button>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shopAuth.js"></script>
<script src="billHistory.js"></script>
<script src="menu-data.js"></script>
<script src="inventory.js"></script>
<script src="adminAuth.js"></script>
<script src="unified-printer-comm.js"></script>
<script src="escpos-receipt.js"></script>
<script src="app.js"></script>
<!-- Live Map boot (progress recorder + loader). app.css for the map is injected on first open. -->
<script type="module" src="dist/live-map/boot.js"></script>
</body>
</html>
