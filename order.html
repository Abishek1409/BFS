<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Best Fruits Stall — Order</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:            #000000;
      --accent:        #389E62;
      --accent-light:  #50B77B;
      --accent-text:   #ffffff;
      --accent-cta:    #F5B041;
      --accent-2:      #EC7063;
      --gold:          var(--accent-cta);
      --text:          #F3F4F6;
      --border:        rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --card:          rgba(25, 25, 25, 0.55);
      --card2:         rgba(35, 30, 25, 0.6);
      --muted:         #9CA3AF;
      --sand:          rgba(255, 255, 255, 0.08);
      --danger:        var(--accent-2);
      --radius:        14px;
      --shadow:        0 8px 32px rgba(0, 0, 0, 0.4);
      --gradient:      linear-gradient(135deg, rgba(56, 158, 98, 0.25) 0%, rgba(0, 0, 0, 0.8) 100%);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── Header ── */
    .app-header {
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      color: #ffffff; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 18px rgba(0,0,0,.3);
      position: sticky; top: 0; z-index: 50;
    }
    .app-header h1 {
      font-size: 1.25rem; font-weight: 800; color: #ffffff; letter-spacing: .3px;
    }
    .table-badge {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; border-radius: 50px; padding: 6px 16px; font-size: .85rem; font-weight: 700;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }

    /* ── Categories ── */
    .cat-scroll {
      display: flex; gap: 8px; padding: 12px 16px;
      overflow-x: auto; border-bottom: 1px solid var(--border);
      position: sticky: top: 68px; z-index: 40;
      background: var(--bg);
    }
    .cat-tab {
      cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04); color: var(--text);
      border-radius: 50px; padding: 6px 16px;
      font-size: .82rem; font-weight: 600; transition: all .2s; white-space: nowrap;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .cat-tab:hover, .cat-tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(80, 183, 123, 0.2);
    }

    /* ── Menu Grid ── */
    .menu-wrap { padding: 12px 16px 120px; max-width: 960px; margin: 0 auto; }
    .category-header {
      font-size: .8rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px;
      margin: 16px 0 8px; padding-left: 4px;
    }
    .menu-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .menu-card {
      border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 14px; cursor: pointer; position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
      display: flex; flex-direction: column; gap: 4px;
      /* Animation initial state */
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-60px) rotateX(90deg);
      transition: opacity 0.8s cubic-bezier(.2,.9,.2,1), filter 0.8s cubic-bezier(.2,.9,.2,1), transform 0.8s cubic-bezier(.2,.9,.2,1), border-color .25s, box-shadow .25s;
      will-change: transform, opacity, filter;
    }
    .menu-card.visible {
      opacity: 1; filter: blur(0px); transform: translateY(0) rotateX(0deg);
    }
    .menu-card:active { transform: scale(0.97); transition: transform 0.1s; }
    .menu-card .emoji { font-size: 1.8rem; line-height: 1; }
    .menu-card .item-name { font-weight: 700; font-size: .85rem; color: var(--text); line-height: 1.2; }
    .menu-card .item-price { font-weight: 800; font-size: .95rem; color: var(--text); margin-top: 2px; }

    /* ── Sticky Cart Bar ── */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: rgba(18,18,18,0.85); backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-top: 1px solid var(--border);
      padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 -4px 24px rgba(0,0,0,.5);
    }
    .cart-info { display: flex; flex-direction: column; }
    .cart-count { font-size: .78rem; color: var(--muted); }
    .cart-total { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .cart-bar-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 12px; padding: 12px 24px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all .18s;
      box-shadow: 0 4px 14px rgba(80,183,123,.25);
      display: flex; align-items: center; gap: 6px;
    }
    .cart-bar-btn:hover { background: var(--accent-light); }
    .cart-bar-btn:disabled { opacity: .5; pointer-events: none; }

    /* ── Bottom Sheet ── */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 100; display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-overlay.show { display: flex; }
    .sheet {
      background: rgba(22,22,22,0.95); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 640px; max-height: 90vh; max-height: 90dvh;
      overflow-y: auto; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
      animation: slideUp .25s ease;
      box-shadow: 0 -8px 40px rgba(0,0,0,.7);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .sheet-title { font-size: 1.1rem; font-weight: 800; }
    .sheet-price { color: var(--accent); font-weight: 700; font-size: 1rem; margin-top: 2px; }
    .sheet-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }
    .sheet-close:hover { color: var(--text); }

    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .toggle-group { display: flex; gap: 8px; }
    .toggle-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--bg); font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: all .18s; color: var(--text); font-family: inherit;
    }
    .toggle-btn.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .qty-row { display: flex; align-items: center; gap: 12px; }
    .qty-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 1.2rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .18s; font-family: inherit;
    }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .qty-num { font-size: 1.1rem; font-weight: 800; min-width: 32px; text-align: center; }
    .note-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: .9rem; font-family: inherit;
      color: var(--text); background: var(--bg); outline: none; resize: none;
      transition: border-color .2s;
    }
    .note-input:focus { border-color: var(--accent); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { border: none; border-radius: 10px; padding: 12px 18px; font-size: .9rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .18s; }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-secondary { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--border-subtle); }

    /* ── Cart Sheet ── */
    .cart-line {
      display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);
    }
    .cart-line:last-child { border-bottom: none; }
    .cart-line-info { flex: 1; min-width: 0; }
    .cart-line-name { font-weight: 700; font-size: .9rem; }
    .cart-line-sub { font-size: .75rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }
    .cart-line-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .cart-line-total { font-weight: 800; font-size: .95rem; }
    .cart-line-remove {
      background: none; border: none; color: var(--muted); font-size: .8rem;
      cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: all .15s;
    }
    .cart-line-remove:hover { color: var(--danger); background: rgba(236,112,99,.1); }
    .cart-totals { padding: 14px 0 8px; border-top: 2px solid var(--border); margin-top: 8px; }
    .cart-total-row { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 4px; color: var(--muted); }
    .cart-total-row.grand { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .btn-confirm {
      width: 100%; background: var(--accent-cta); color: #1a1a1a;
      border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 800;
      cursor: pointer; font-family: inherit; margin-top: 12px; transition: all .18s;
      box-shadow: 0 4px 14px rgba(245,176,65,.25);
    }
    .btn-confirm:hover { filter: brightness(1.1); }
    .btn-confirm:disabled { opacity: .5; pointer-events: none; }

    /* ── Confirmation ── */
    .confirm-screen {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .confirm-icon { font-size: 4rem; margin-bottom: 16px; }
    .confirm-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .confirm-msg { color: var(--muted); font-size: .95rem; max-width: 320px; line-height: 1.5; }

    /* ── Loading ── */
    .loading-screen {
      position: fixed; inset: 0; z-index: 150;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: .9rem; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .menu-card .emoji { font-size: 2.2rem; }
      .menu-card .item-name { font-size: .92rem; }
      .app-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Loading menu…</div>
  </div>

  <!-- Header -->
  <header class="app-header" id="appHeader" style="display:none">
    <h1>&#x1F379; Best Fruits Stall</h1>
    <div class="table-badge" id="tableBadge">Table —</div>
  </header>

  <!-- Category tabs -->
  <div class="cat-scroll" id="catScroll" style="display:none"></div>

  <!-- Menu -->
  <div class="menu-wrap" id="menuWrap" style="display:none"></div>

  <!-- Sticky cart bar -->
  <div class="cart-bar" id="cartBar" style="display:none">
    <div class="cart-info">
      <div class="cart-count" id="cartCount">0 items</div>
      <div class="cart-total" id="cartTotal">&#x20B9;0</div>
    </div>
    <button class="cart-bar-btn" id="cartBarBtn" onclick="openCart()">
      &#x1F6D2; View Cart
    </button>
  </div>

  <!-- Item options sheet -->
  <div class="sheet-overlay" id="itemSheetOverlay" onclick="if(event.target===this)closeItemSheet()">
    <div class="sheet" id="itemSheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="itemSheetTitle">Item</div>
          <div class="sheet-price" id="itemSheetPrice">&#x20B9;0 each</div>
        </div>
        <button class="sheet-close" onclick="closeItemSheet()">&#x2715;</button>
      </div>
      <div class="form-row" id="iceRow">
        <label>&#x1F9CA; Ice Preference</label>
        <div class="toggle-group" id="iceGroup">
          <button class="toggle-btn selected" data-val="With Ice" onclick="selectToggle(this,'iceGroup')">With Ice</button>
          <button class="toggle-btn" data-val="Without Ice" onclick="selectToggle(this,'iceGroup')">Without Ice</button>
        </div>
      </div>
      <div class="form-row" id="sugarRow">
        <label>&#x1F36C; Sugar Level</label>
        <div class="toggle-group" id="sugarGroup">
          <button class="toggle-btn selected" data-val="Normal Sugar" onclick="selectToggle(this,'sugarGroup')">Normal</button>
          <button class="toggle-btn" data-val="Less Sugar" onclick="selectToggle(this,'sugarGroup')">Less Sugar</button>
          <button class="toggle-btn" data-val="No Sugar" onclick="selectToggle(this,'sugarGroup')">No Sugar</button>
        </div>
      </div>
      <div class="form-row" id="sizeRow">
        <label>&#x1F4CF; Size</label>
        <div class="toggle-group" id="sizeGroup">
          <button class="toggle-btn selected" data-val="Regular" onclick="selectToggle(this,'sizeGroup')">Regular</button>
          <button class="toggle-btn" data-val="Large" onclick="selectToggle(this,'sizeGroup')">Large (+&#x20B9;10)</button>
        </div>
      </div>
      <div class="form-row">
        <label>&#x1F4DD; Special Note (optional)</label>
        <textarea class="note-input" id="itemNote" rows="2" placeholder="e.g. extra pulp, no straw…"></textarea>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <div class="qty-num" id="qtyNum">1</div>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" onclick="closeItemSheet()">Cancel</button>
        <button class="btn btn-primary" onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Cart sheet -->
  <div class="sheet-overlay" id="cartSheetOverlay" onclick="if(event.target===this)closeCart()">
    <div class="sheet" id="cartSheet">
      <div class="sheet-head">
        <div class="sheet-title">Your Cart</div>
        <button class="sheet-close" onclick="closeCart()">&#x2715;</button>
      </div>
      <div id="cartLines"></div>
      <div class="cart-totals" id="cartTotals" style="display:none">
        <div class="cart-total-row"><span>Subtotal</span><span id="cartSubtotal">&#x20B9;0</span></div>
        <div class="cart-total-row grand"><span>TOTAL</span><span id="cartGrand">&#x20B9;0</span></div>
      </div>
      <button class="btn-confirm" id="confirmBtn" onclick="confirmOrder()">Confirm Order</button>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="confirm-screen" id="confirmScreen" style="display:none">
    <div class="confirm-icon">&#x2705;</div>
    <div class="confirm-title">Order placed!</div>
    <div class="confirm-msg" id="confirmMsg">Table — your order is with the kitchen. You can close this tab now.</div>
  </div>

  <script>
    /* ===== STATE ===== */
    let menuData = null;
    let cart = [];
    let currentItem = null;
    let currentQty = 1;
    let tableNum = '';

    /* ===== INIT ===== */
    (function init() {
      const params = new URLSearchParams(window.location.search);
      tableNum = params.get('table') || '';
      document.getElementById('tableBadge').textContent = 'Table ' + (tableNum || '—');
      if (!tableNum) {
        document.getElementById('tableBadge').textContent = 'Table —';
      }
      loadMenu();
    })();

    async function loadMenu() {
      try {
        const res = await fetch('/api/menu');
        if (!res.ok) throw new Error('Failed to load menu');
        menuData = await res.json();
        renderCategories();
        renderMenu('All');
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('appHeader').style.display = 'flex';
        document.getElementById('catScroll').style.display = 'flex';
        document.getElementById('menuWrap').style.display = 'block';
        animateMenuItems();
      } catch (e) {
        document.getElementById('loadingScreen').innerHTML =
          '<div class="confirm-msg" style="color:var(--danger)">Could not load menu. Please check your connection and refresh.</div>';
      }
    }

    /* ===== CATEGORIES ===== */
    function renderCategories() {
      const cats = ['All', ...new Set(menuData.categories.map(c => c.name))];
      const icons = { All: '🍽️', Juices: '🍹', Shakes: '🥤', Snacks: '🍿', Specials: '⭐' };
      document.getElementById('catScroll').innerHTML = cats.map(c =>
        `<button class="cat-tab ${c==='All'?'active':''}" onclick="filterCat(this,'${c}')">${icons[c]||''} ${c}</button>`
      ).join('');
    }

    function filterCat(btn, cat) {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderMenu(cat);
      animateMenuItems();
    }

    /* ===== MENU RENDERING ===== */
    function renderMenu(cat) {
      const wrap = document.getElementById('menuWrap');
      let items = [];
      if (cat === 'All') {
        menuData.categories.forEach(c => {
          items = items.concat(c.items.map(it => ({ ...it, category: c.name })));
        });
      } else {
        const c = menuData.categories.find(x => x.name === cat);
        if (c) items = c.items.map(it => ({ ...it, category: c.name }));
      }
      // Group by category
      const grouped = {};
      items.forEach(it => {
        if (!grouped[it.category]) grouped[it.category] = [];
        grouped[it.category].push(it);
      });
      let html = '';
      Object.keys(grouped).forEach(catName => {
        html += `<div class="category-header">${catName}</div>`;
        html += `<div class="menu-grid">`;
        grouped[catName].forEach(item => {
          html += `
            <div class="menu-card" onclick="openItemSheet(${item.id}, '${catName}')">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="item-price">&#x20B9;${item.price}</div>
            </div>`;
        });
        html += `</div>`;
      });
      wrap.innerHTML = html;
    }

    function animateMenuItems() {
      const cards = document.querySelectorAll('.menu-card');
      cards.forEach((card, i) => {
        card.classList.remove('visible');
        setTimeout(() => card.classList.add('visible'), i * 40 + 30);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* ===== ITEM SHEET ===== */
    function openItemSheet(itemId, catName) {
      let item;
      if (catName) {
        const c = menuData.categories.find(x => x.name === catName);
        item = c && c.items.find(x => x.id === itemId);
      }
      if (!item) return;
      currentItem = item;
      currentQty = 1;
      document.getElementById('itemSheetTitle').textContent = item.name;
      document.getElementById('itemSheetPrice').textContent = '&#x20B9;' + item.price + ' each';
      document.getElementById('qtyNum').textContent = '1';
      document.getElementById('itemNote').value = '';

      const isJuice = /juice/i.test(catName);
      document.getElementById('iceRow').style.display = isJuice ? '' : 'none';
      document.getElementById('sugarRow').style.display = isJuice ? '' : 'none';
      document.getElementById('sizeRow').style.display = isJuice ? '' : 'none';

      ['iceGroup','sugarGroup','sizeGroup'].forEach(gid => {
        const g = document.getElementById(gid);
        g.querySelectorAll('.toggle-btn').forEach((b,i) => b.classList.toggle('selected', i === 0));
      });

      document.getElementById('itemSheetOverlay').classList.add('show');
    }

    function closeItemSheet() {
      document.getElementById('itemSheetOverlay').classList.remove('show');
      currentItem = null;
    }

    function selectToggle(btn, groupId) {
      document.getElementById(groupId).querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function getToggleVal(groupId) {
      const g = document.getElementById(groupId);
      const sel = g.querySelector('.toggle-btn.selected');
      return sel ? sel.dataset.val : null;
    }

    function changeQty(delta) {
      currentQty = Math.max(1, currentQty + delta);
      document.getElementById('qtyNum').textContent = currentQty;
    }

    function addToCart() {
      if (!currentItem) return;
      const ice = getToggleVal('iceGroup');
      const sugar = getToggleVal('sugarGroup');
      const size = getToggleVal('sizeGroup');
      const note = document.getElementById('itemNote').value.trim();
      const sizeExtra = (size === 'Large') ? 10 : 0;
      const unitPrice = currentItem.price + sizeExtra;

      const parts = [];
      if (ice) parts.push(ice);
      if (sugar && sugar !== 'Normal Sugar') parts.push(sugar);
      if (size && size !== 'Regular') parts.push(size);
      if (note) parts.push(note);
      const spec = parts.length ? ' (' + parts.join(', ') + ')' : '';

      cart.push({
        uid: Date.now() + Math.random(),
        name: currentItem.name + spec,
        baseName: currentItem.name,
        price: unitPrice,
        qty: currentQty,
        total: unitPrice * currentQty,
        spec: parts.join(', ')
      });

      updateCartBar();
      closeItemSheet();
    }

    /* ===== CART BAR ===== */
    function updateCartBar() {
      const count = cart.reduce((s,i) => s + i.qty, 0);
      const total = cart.reduce((s,i) => s + i.total, 0);
      document.getElementById('cartCount').textContent = count + ' item' + (count !== 1 ? 's' : '');
      document.getElementById('cartTotal').textContent = '&#x20B9;' + total.toFixed(0);
      document.getElementById('cartBar').style.display = count ? 'flex' : 'none';
    }

    /* ===== CART SHEET ===== */
    function openCart() {
      renderCartSheet();
      document.getElementById('cartSheetOverlay').classList.add('show');
    }

    function closeCart() {
      document.getElementById('cartSheetOverlay').classList.remove('show');
    }

    function renderCartSheet() {
      const container = document.getElementById('cartLines');
      if (!cart.length) {
        container.innerHTML = '<div class="confirm-msg" style="padding:20px 0">Your cart is empty.</div>';
        document.getElementById('cartTotals').style.display = 'none';
        return;
      }
      container.innerHTML = cart.map((line, idx) => `
        <div class="cart-line">
          <div class="cart-line-info">
            <div class="cart-line-name">${escapeHtml(line.name)}</div>
            <div class="cart-line-sub">&#x20B9;${line.price} × ${line.qty}</div>
          </div>
          <div class="cart-line-meta">
            <div class="cart-line-total">&#x20B9;${line.total.toFixed(0)}</div>
            <button class="cart-line-remove" onclick="removeLine(${idx})">Remove</button>
          </div>
        </div>
      `).join('');

      const subtotal = cart.reduce((s,i) => s + i.total, 0);
      document.getElementById('cartSubtotal').innerHTML = '&#x20B9;' + subtotal.toFixed(0);
      document.getElementById('cartGrand').innerHTML = '&#x20B9;' + subtotal.toFixed(0);
      document.getElementById('cartTotals').style.display = 'block';
    }

    function removeLine(idx) {
      cart.splice(idx, 1);
      updateCartBar();
      renderCartSheet();
    }

    /* ===== CONFIRM ORDER ===== */
    async function confirmOrder() {
      if (!cart.length) return;
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      const payload = {
        table: String(tableNum),
        items: cart.map(i => ({
          name: i.name,
          baseName: i.baseName,
          price: i.price,
          qty: i.qty,
          ice: i.ice,
          sugar: i.sugar,
          size: i.size,
          note: i.note,
          spec: i.spec || 'Standard',
          total: i.total
        }))
      };

      try {
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        showConfirmation();
      } catch (e) {
        alert('Could not place order. Please check your WiFi and try again.');
        btn.disabled = false;
        btn.textContent = 'Confirm Order';
      }
    }

    function showConfirmation() {
      document.getElementById('confirmMsg').innerHTML =
        'Table <strong>' + escapeHtml(tableNum) + '</strong> — your order is with the kitchen. You can close this tab now.';
      document.getElementById('confirmScreen').style.display = 'flex';
      // Note: browsers only allow scripts to auto-close tabs they opened themselves.
      // This will silently do nothing on a tab opened by scanning a QR code —
      // the on-screen message is the real fallback, not the auto-close.
      setTimeout(() => { try { window.close(); } catch(e){} }, 1000);
    }
  </script>
</body>
</html>
