<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live 3D Café Map - Firebase Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Trebuchet MS', Arial, sans-serif;
            background: #010101;
            color: #fff8e8;
            overflow: hidden;
        }
        
        .demo-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        
        .demo-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(7, 7, 6, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 122, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            gap: 20px;
        }
        
        .demo-title {
            color: #d9a83e;
            font-size: 18px;
            font-weight: 700;
        }
        
        .demo-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .demo-status.connected {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }
        
        .demo-status.disconnected {
            background: rgba(237, 137, 54, 0.2);
            color: #ed8936;
        }
        
        .map-wrapper {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100vh - 60px);
        }
        
        .loading-screen {
            position: fixed;
            inset: 0;
            background: rgba(1, 1, 1, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(217, 168, 62, 0.3);
            border-top: 3px solid #d9a83e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #c8b98f;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <!-- Header -->
        <div class="demo-header">
            <div class="demo-title">🗺️ Live 3D Café Map</div>
            <div id="connectionStatus" class="demo-status disconnected">Connecting...</div>
            <div style="margin-left: auto; font-size: 12px; color: #c8b98f;">
                Firebase Integration Demo
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Firebase integration...</div>
        </div>

        <!-- 3D Map Container -->
        <div class="map-wrapper">
            <div id="mapContainer" style="width: 100%; height: 100%;"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <!-- React and 3D Libraries -->
    <script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/three@0.186.1/build/three.min.js"></script>
    <script src="https://unpkg.com/@react-three/fiber@9.8.1/dist/react-three-fiber.umd.js"></script>
    <script src="https://unpkg.com/@react-three/drei@10.7.9/dist/react-three-drei.umd.js"></script>

    <script type="module">
        import { MapWithControls } from './ui/MapWithControls.js';
        
        const { useState, useEffect } = React;
        
        function LiveCafeMapDemo() {
            const [loading, setLoading] = useState(true);
            const [connected, setConnected] = useState(false);
            const [error, setError] = useState(null);
            
            useEffect(() => {
                const initializeFirebase = async () => {
                    try {
                        // Check if Firebase is available
                        if (!window.firebaseConfig || !window.firebase) {
                            throw new Error('Firebase not available');
                        }
                        
                        // Initialize Firebase
                        if (!firebase.apps.length) {
                            firebase.initializeApp(window.firebaseConfig);
                        }
                        
                        // Test connection
                        const connectionRef = firebase.database().ref('.info/connected');
                        connectionRef.on('value', (snapshot) => {
                            const isConnected = snapshot.val() === true;
                            setConnected(isConnected);
                            
                            // Update status display
                            const statusEl = document.getElementById('connectionStatus');
                            if (statusEl) {
                                statusEl.textContent = isConnected ? '🟢 Live Data' : '🟡 Offline Mode';
                                statusEl.className = `demo-status ${isConnected ? 'connected' : 'disconnected'}`;
                            }
                        });
                        
                        // Delay to show loading state
                        setTimeout(() => {
                            setLoading(false);
                            document.getElementById('loadingScreen').style.display = 'none';
                        }, 2000);
                        
                    } catch (err) {
                        console.error('Firebase initialization failed:', err);
                        setError(err);
                        setLoading(false);
                        
                        // Show error in status
                        const statusEl = document.getElementById('connectionStatus');
                        if (statusEl) {
                            statusEl.textContent = '❌ Connection Failed';
                            statusEl.className = 'demo-status disconnected';
                        }
                    }
                };
                
                initializeFirebase();
            }, []);
            
            const handleTableClick = (tableId, orderInfo) => {
                console.log('Table clicked:', tableId);
                if (orderInfo) {
                    console.log('Order info:', orderInfo);
                    // In a real implementation, this would open a side panel with order details
                    alert(`Table ${orderInfo.tableNumber}\nOrder: ${orderInfo.orderNo}\nStatus: ${orderInfo.status}\nTotal: ₹${orderInfo.total}`);
                } else {
                    alert(`Table ${tableId.split('-')[1]} - No active orders`);
                }
            };
            
            const handleModeChange = (newMode) => {
                console.log('Mode changed to:', newMode);
            };
            
            if (loading) {
                return null; // Loading screen handles display
            }
            
            return React.createElement(MapWithControls, {
                initialMode: 'dimmed',
                onTableClick: handleTableClick,
                onModeChange: handleModeChange,
                showCounters: true,
                showEvents: true,
                showHelp: true,
                className: 'firebase-demo-map'
            });
        }
        
        // Render the demo
        const container = document.getElementById('mapContainer');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(LiveCafeMapDemo));
        
        // Console help
        console.log('%c🗺️ Live 3D Café Map Demo', 'color: #d9a83e; font-weight: bold; font-size: 16px;');
        console.log('Firebase integration with real-time table status updates');
        console.log('Features:');
        console.log('- Real-time order synchronization');
        console.log('- Live counters with sales metrics');
        console.log('- Events feed showing recent activity');
        console.log('- Interactive 3D table visualization');
        console.log('- Automatic status mapping from Firebase orders');
    </script>
</body>
</html>
